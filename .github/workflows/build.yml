name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: diktatura
          path: build/libs/*.jar
      # Свежая сборка из main всегда лежит в релизе "dev" (Releases → dev).
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev "$JAR" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Dev build ${GITHUB_SHA::7}" \
            --notes "Автоматическая сборка из main (коммит $GITHUB_SHA). Minecraft 1.21.1, Fabric Loader 0.16+, нужен Fabric API."
      # Новая версия (mod_version, для которой ещё нет релиза) → тег vX.Y.Z и релиз с jar.
      - name: Publish version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — новая версия не объявлена, пропускаю."
            exit 0
          fi
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p { print }' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "Версия $VERSION." > notes.md; fi
          printf '\nMinecraft 1.21.1, Fabric Loader 0.16+, нужен Fabric API.\n' >> notes.md
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Diktatura $VERSION" --notes-file notes.md --latest
      # Тестовая сборка из ветки build/* (ручной запуск): jar кладётся в черновик релиза.
      # Черновик видят только владельцы репозитория; тег не создаётся, main не меняется.
      - name: Publish test build (draft)
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/build/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="test-$VERSION"
          gh release delete "$TAG" --yes || true
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)
          gh release create "$TAG" "$JAR" --draft --target "$GITHUB_SHA" \
            --title "Тестовая сборка $VERSION" --notes "Черновик: тестовая сборка из ветки ${GITHUB_REF_NAME} (коммит $GITHUB_SHA)."
